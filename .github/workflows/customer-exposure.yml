name: Monthly Customer Exposure ETL

on:
  schedule:
    # 2nd day of each month, ~13:29 UTC — 10-Ks/10-Qs are annual/quarterly,
    # monthly refresh keeps the latest filings covered; off the :00 mark
    - cron: '29 13 2 * *'

  # Manual trigger for testing / backfills
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: 'Limit run to first N tickers (testing)'
        required: false
        default: ''

concurrency:
  group: customer-exposure-etl
  cancel-in-progress: false

jobs:
  run-customer-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # ~90 tickers × (2 filings + Gemini pauses)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests psycopg2-binary

      - name: Run Customer Exposure ETL
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          WATCHLIST_BASE_URL: ${{ vars.WATCHLIST_BASE_URL }}
          TICKER_LIMIT:       ${{ github.event.inputs.ticker_limit }}
          # INTERIM bootstrap floors (2026-08-18): the validation rewrite
          # resolves 149/222 tickers but the 0.90/0.50 defaults block ALL
          # publishing until near-perfect extraction, leaving production on
          # the 8-ticker post-incident husk. Publishing at current quality
          # establishes the baseline ratchet; raise these toward the
          # defaults as the remaining grammar tail (reordered table quotes,
          # exotic prose) is fixed. Regression safety is unchanged: the
          # retention guard and signature-gated publish stay active.
          CUSTOMER_EXPOSURE_MIN_PROVIDER_COVERAGE: "0.60"
          CUSTOMER_EXPOSURE_MIN_USABLE_COVERAGE:   "0.20"
        run: python src/customer_exposure.py

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"text":"⚠️ Wizzles Watchlist customer-exposure ETL failed — check the GitHub Actions log for details."}'
          fi
