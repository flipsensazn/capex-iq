name: Deploy Site (Workers)

# Replaces the Cloudflare Pages Git integration: every merge to main builds
# the frontend and deploys the site Worker (workers/site) — API functions,
# static assets, KV binding, all in one deployable.
#
# Deployment requires CLOUDFLARE_API_TOKEN (Workers Scripts:Edit); runtime
# credentials are synchronized from the repository secrets below.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4.x requires Node >= 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Python Regression Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Frontend
        run: npx vite build

      # Plain wrangler instead of cloudflare/wrangler-action: the action's
      # bundled-wrangler bootstrap breaks under current runner npm (npx
      # refuses its install) and its secrets uploader can't read
      # wrangler.jsonc. Two explicit steps are simpler and debuggable.
      - name: Deploy Worker
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.113.0 deploy

      # Sync the Worker's runtime secrets from the repo secrets the ETL
      # workflows already use — rotate once in GitHub, next deploy syncs.
      # (env FINNHUB_KEY maps from the repo's FINNHUB_API_KEY name.)
      - name: Sync Worker Secrets
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CF_ACCESS_API_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
          # These four accept either a repo variable or a repo secret. The list
          # ID and site key are not sensitive, so a variable is the natural home
          # — but an empty value here makes the jq below emit null, which DELETES
          # the deployed Worker secret. Falling back to secrets.* keeps a deploy
          # from silently wiping a key that was simply stored in the other place.
          ACCESS_MEMBERS_LIST_ID: ${{ vars.ACCESS_MEMBERS_LIST_ID || secrets.ACCESS_MEMBERS_LIST_ID }}
          ACCESS_MEMBERS_GROUP_ID: ${{ vars.ACCESS_MEMBERS_GROUP_ID || secrets.ACCESS_MEMBERS_GROUP_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # JSON null deletes a previously deployed secret, preventing retired
          # roster IDs or Turnstile credentials from surviving configuration removal.
          jq -n \
            --arg a "$ADMIN_PASSWORD" \
            --arg d "$DATABASE_URL" \
            --arg g "$GEMINI_API_KEY" \
            --arg f "$FINNHUB_KEY" \
            --arg t "$CF_ACCESS_API_TOKEN" \
            --arg ml "$ACCESS_MEMBERS_LIST_ID" \
            --arg mg "$ACCESS_MEMBERS_GROUP_ID" \
            --arg ts "$TURNSTILE_SITE_KEY" \
            --arg tk "$TURNSTILE_SECRET_KEY" \
            '{
              ADMIN_PASSWORD: (if $a != "" then $a else null end),
              DATABASE_URL: (if $d != "" then $d else null end),
              GEMINI_API_KEY: (if $g != "" then $g else null end),
              FINNHUB_KEY: (if $f != "" then $f else null end),
              CF_ACCESS_API_TOKEN: (if $t != "" then $t else null end),
              ACCESS_MEMBERS_LIST_ID: (if $ml != "" then $ml else null end),
              ACCESS_MEMBERS_GROUP_ID: (if $mg != "" then $mg else null end),
              TURNSTILE_SITE_KEY: (if $ts != "" then $ts else null end),
              TURNSTILE_SECRET_KEY: (if $tk != "" then $tk else null end)
            }' > .secrets.json
          npx --yes wrangler@4.113.0 secret bulk .secrets.json --name capex-iq
          rm .secrets.json
